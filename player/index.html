<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="bg"></div>
        <div class="bg-mask"></div>
        <div class="player">
            <div class="player-track">
                <div class="album-name">称为</div>
                <div class="track-name">黄子弘凡 - 称为</div>
                <div class="track-time">
                    <div class="current-time">00:00</div>
                    <div class="total-time">04:18</div>
                </div>
                <div class="progress-box">
                    <div class="hover-time">00:36</div>
                    <div class="hover-bar"></div>
                    <div class="progress-bar"></div>
                </div>
            </div>
            <div class="player-content">
                <div class="album-cover">
                    <img src="../favorites/称为.jpg" alt="" class="active">
                    <img src="../favorites/稻香.jpg" alt="">
                    <img src="../favorites/邓紫棋,jpg.jpg" alt="">
                    <img src="../favorites/取舍.jpg" alt="">
                    <img src="../favorites/后陡门的夏.jpg" alt="">
                    <img src="../favorites/嘉宾.jpg" alt="">
                    <img src="../favorites/刘宇.jpg" alt="">
                    <img src="../favorites/如果爱忘了.jpg" alt="">
                    <img src="../favorites/薛之谦.jpg" alt="">
                </div>
                <div class="play-controls">
                    <div class="control">
                        <div class="button play-prev">
                            <i class="fa fa-step-backward"></i>
                        </div>
                    </div>
                    <div class="control">
                        <div class="button play-pause">
                            <i class="fa fa-play"></i>
                        </div>
                    </div>
                    <div class="control">
                        <div class="button play-next">
                            <i class="fa fa-step-forward"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
